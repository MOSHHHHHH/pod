name: Audit subscribed RSS video availability

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-rss-video.yml'
      - 'tests/audit_rss_video.py'

permissions:
  contents: read

jobs:
  audit-video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate audit syntax
        run: python -m py_compile tests/audit_rss_video.py
      - name: Inspect RSS media and relevant declarations (no media downloads)
        run: python tests/audit_rss_video.py
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscribed-rss-video-audit-v2
          path: |
            video-audit.json
            video-audit.md
          retention-days: 14
          if-no-files-found: warn
