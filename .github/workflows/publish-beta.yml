name: Publish Podki beta to public

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Publish beta to production'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-podki-beta
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and copy beta
        run: |
          node --check files/podcast_processor_v2_beta.js
          cp files/podcast_processor_v2_beta.js files/podcast_processor_v2.js
          node --check files/podcast_processor_v2.js
      - name: Publish beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- files/podcast_processor_v2.js
          if git diff --cached --quiet; then
            echo "Production already matches beta."
            exit 0
          fi
          git commit -m "Publish Podki beta to production"
          git push origin HEAD:main
      - name: Request CDN cache purge
        run: |
          curl --fail --silent --show-error --retry 2 'https://purge.jsdelivr.net/gh/MOSHHHHHH/pod@main/files/podcast_processor_v2.js' || echo "::warning::CDN purge failed; production commit succeeded."
