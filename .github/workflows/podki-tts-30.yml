name: Podki 30 vocal logo TTS experiments
on:
  push:
    branches: [experiment/podki-tts-30]
    paths:
      - 'tools/podki_tts_30.py'
      - '.github/workflows/podki-tts-30.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SDK
        run: python -m pip install 'google-genai>=1.50,<3'
      - name: Run in six groups of five (stop at quota)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/podki_tts_30.py
      - name: Upload samples and ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podki-tts-30-results
          path: podki-tts-30/
          retention-days: 7
          if-no-files-found: warn
      - name: Commit WAV samples and metadata to experiment branch
        if: always()
        run: |
          if [ ! -d podki-tts-30 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podki-tts-30
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "experiment: store completed Podki voice logo samples"
          git pull --rebase origin "$(git branch --show-current)"
          git push
