name: Audit public Podcast Index matches without API key
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-keyless-directory-video.yml'
      - 'tests/audit_keyless_directory_video.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public Podcast Index search and inspect RSS candidates
        run: python tests/audit_keyless_directory_video.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-index-keyless-video-search
          path: |
            directory-video-audit.json
            directory-video-audit.md
          retention-days: 14
          if-no-files-found: warn
