name: Podki Hebrew video voiceovers (Gemini 3.8)

on:
  workflow_dispatch:
  push:
    branches: [gemini-live-phone]
    paths:
      - '.github/workflows/podki-video-voiceovers.yml'
      - 'phone-line/phone_menu.py'
      - 'phone-line/record_and_probe.py'

permissions:
  contents: read
  actions: read

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore latest completed audio checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p gemini-live-phone-audio
          artifact_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=gemini-live-phone-audio&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "gemini-live-phone")][0].id // empty')
          if [ -n "$artifact_id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > /tmp/phone-audio-checkpoint.zip
            unzip -o /tmp/phone-audio-checkpoint.zip -d gemini-live-phone-audio
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Gen AI SDK
        run: python -m pip install 'google-genai>=1.50,<3'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Generate Gemini Live phone prompts with checkpoints
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python phone-line/record_and_probe.py
      - name: Upload audio and transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-live-phone-audio
          path: gemini-live-phone-audio/
          retention-days: 30
          if-no-files-found: warn
