name: One-time Podki album cover optimization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-podki-cover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Validate and optimize cover in place
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image

          path = Path("assets/podki/album-cover.png")
          original = path.read_bytes()
          assert original.startswith(b"\x89PNG\r\n\x1a\n"), "Not a PNG"
          with Image.open(BytesIO(original)) as im:
              im.verify()
          with Image.open(BytesIO(original)) as im:
              im.load()
              print(f"Original: {im.size}, {im.mode}, {len(original)} bytes")
              best = None
              for size in (1024, 896, 768, 640, 512):
                  work = im.copy()
                  work.thumbnail((size, size), Image.Resampling.LANCZOS)
                  for colors in (256, 192, 128):
                      if work.mode in ("RGBA", "LA") or "transparency" in work.info:
                          reduced = work.convert("RGBA").quantize(colors=colors, method=Image.Quantize.FASTOCTREE)
                      else:
                          reduced = work.convert("RGB").quantize(colors=colors, method=Image.Quantize.MEDIANCUT)
                      buf = BytesIO()
                      reduced.save(buf, format="PNG", optimize=True, compress_level=9)
                      data = buf.getvalue()
                      print(f"Candidate: {reduced.size}, {colors} colors, {len(data)} bytes")
                      if len(data) <= 900 * 1024:
                          best = data
                          break
                  if best:
                      break
              if not best:
                  raise RuntimeError("Could not safely reduce album-cover.png below 900 KiB")
              path.write_bytes(best)
              with Image.open(path) as check:
                  check.verify()
              print(f"Saved: {len(best)} bytes; original was {len(original)} bytes")
          PY
      - name: Commit optimized image and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- '.github/workflows/one-time-podki-cover.yml'
          git add -- assets/podki/album-cover.png
          git diff --cached --check
          git commit -m "Optimize Podki fallback album cover below ID3 size limit"
          git push
