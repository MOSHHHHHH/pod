name: Podki Trending JSON Experiment
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *' # daily at 04:17 UTC (06:17/07:17 Israel)
permissions:
  contents: write
jobs:
  generate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: trending-experiment-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Decisions SDK
        run: pip install 'google-genai>=3.2.0'
      - name: Generate JSON only (no emails)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/trending/generate_json.py
      - name: Save experiment history to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trending/experiments data/trending/experiment_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive Podki trending experiment ${{ github.run_id }}"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: podki-trending-json
          path: trending-output/daily_recommendation.json
          if-no-files-found: error
