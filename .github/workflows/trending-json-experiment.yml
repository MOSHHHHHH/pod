name: Podki Trending JSON Experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-json:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Decisions SDK
        run: pip install 'google-genai>=3.2.0'
      - name: Generate JSON only (no emails)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/trending/generate_json.py
      - uses: actions/upload-artifact@v4
        with:
          name: podki-trending-json
          path: trending-output/daily_recommendation.json
          if-no-files-found: error
