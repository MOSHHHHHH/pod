name: Publish Podki beta to production
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to replace production with beta'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: podki-production-publish
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate and promote beta
        run: |
          set -euo pipefail
          node --check files/podcast_processor_v2_beta.js
          sed '1{/^\/\/ PODKI BETA$/d;}' files/podcast_processor_v2_beta.js > files/podcast_processor_v2.js
          node --check files/podcast_processor_v2.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files/podcast_processor_v2.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Podki beta to production'
            git push origin HEAD:main
          fi
      - name: Refresh production CDN
        run: |
          curl --fail --show-error --silent --retry 3 'https://purge.jsdelivr.net/gh/MOSHHHHHH/pod@main/files/podcast_processor_v2.js'
