name: Generate Podki audio-intro assets
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate_podki_intro.py
      - .github/workflows/podki-intro-assets.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate MP3 files
        run: python3 scripts/generate_podki_intro.py
      - name: Commit reproducible MP3 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/podki-intro-*-stereo.mp3
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate Podki short MP3 intro"
            git push
          fi
